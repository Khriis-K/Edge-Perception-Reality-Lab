[project]
name = "edge-perception-reliability-lab"
version = "0.1.0"
description = "Local workbench for evaluating a pretrained detector under real and synthetic adverse conditions."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "numpy>=2.5",
    "opencv-python-headless>=5.0",
    "onnxruntime>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
]

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Tests that need the real detector's weights: run them with `pytest -m model` after fetching.
markers = ["model: needs the fetched YOLOX weights (scripts/fetch_model.py)"]
addopts = "-m 'not model'"
